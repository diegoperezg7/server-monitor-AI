<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00D4FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#00D4FF" stroke-opacity="0.22"/>

  <!-- heartbeat line -->
  <polyline points="990,212 1036,212 1050,212 1061,170 1072,250 1084,132 1096,212 1121,212 1137,212 1146,190 1155,212 1236,212" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1236" cy="212" r="6" fill="#00D4FF"/>
  <!-- ban markers -->
  <g fill="#ef4444">
    <circle cx="1150" cy="112" r="5"/><circle cx="1188" cy="96" r="3.5" fill-opacity="0.7"/><circle cx="1214" cy="124" r="4" fill-opacity="0.85"/>
  </g>

  <!-- mark: shield with a pulse -->
  <g transform="translate(70 84)">
    <rect width="152" height="152" rx="36" fill="#111821" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M76 28 L114 42 V78 C114 104 96 120 76 128 C56 120 38 104 38 78 V42 Z" fill="none" stroke="#00D4FF" stroke-width="6" stroke-linejoin="round"/>
    <polyline points="50,82 64,82 70,70 78,96 86,64 92,82 102,82" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="250" y="148" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">server-monitor<tspan fill="#00D4FF">-AI</tspan></text>
  <text x="252" y="194" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#a3acb9">Self-hosted monitoring, CrowdSec security and a local-LLM digest</text>
